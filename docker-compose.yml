services:
  postgres:
    image: postgres:16-alpine
    container_name: eventhub-postgres
    environment:
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub
      POSTGRES_DB: eventhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-server:
    build:
      context: .
      dockerfile: backend/discovery-server/Dockerfile
      args:
        JAR_FILE: backend/discovery-server/target/*.jar
    container_name: eventhub-discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
      args:
        JAR_FILE: backend/api-gateway/target/*.jar
    container_name: eventhub-api-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
      args:
        JAR_FILE: backend/auth-service/target/*.jar
    container_name: eventhub-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: eventhub
      SPRING_DATASOURCE_PASSWORD: eventhub
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EVENTHUB_JWT_SECRET: ZXZlbnRodWItZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMzI=
      EVENTHUB_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
      args:
        JAR_FILE: backend/user-service/target/*.jar
    container_name: eventhub-user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: eventhub
      SPRING_DATASOURCE_PASSWORD: eventhub
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  event-service:
    build:
      context: .
      dockerfile: backend/event-service/Dockerfile
      args:
        JAR_FILE: backend/event-service/target/*.jar
    container_name: eventhub-event-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_db
      SPRING_DATASOURCE_USERNAME: eventhub
      SPRING_DATASOURCE_PASSWORD: eventhub
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EVENTHUB_JWT_SECRET: ZXZlbnRodWItZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMzI=
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  booking-service:
    build:
      context: .
      dockerfile: backend/booking-service/Dockerfile
      args:
        JAR_FILE: backend/booking-service/target/*.jar
    container_name: eventhub-booking-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      SPRING_DATASOURCE_USERNAME: eventhub
      SPRING_DATASOURCE_PASSWORD: eventhub
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EVENTHUB_JWT_SECRET: ZXZlbnRodWItZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMzI=
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
      args:
        JAR_FILE: backend/notification-service/target/*.jar
    container_name: eventhub-notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: eventhub
      SPRING_DATASOURCE_PASSWORD: eventhub
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

volumes:
  postgres-data:
