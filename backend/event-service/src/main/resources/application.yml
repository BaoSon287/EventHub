server:
  port: ${PORT:8083}
spring:
  application:
    name: event-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/event_db}
    username: ${SPRING_DATASOURCE_USERNAME:eventhub}
    password: ${SPRING_DATASOURCE_PASSWORD:eventhub}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

eventhub:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
  internal-api-key: ${INTERNAL_API_KEY:eventhub-internal-secret-change-me}
  upload:
    event-image-dir: ${EVENT_IMAGE_UPLOAD_DIR:uploads/events}
    public-base-url: ${EVENT_IMAGE_PUBLIC_BASE_URL:http://localhost:8080}
    event-image-public-path: ${EVENT_IMAGE_PUBLIC_PATH:/api/events/uploads/events}
