server:
  port: 8083
spring:
  application:
    name: event-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/event_db}
    username: ${SPRING_DATASOURCE_USERNAME:eventhub}
    password: ${SPRING_DATASOURCE_PASSWORD:eventhub}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

eventhub:
  jwt:
    secret: ${EVENTHUB_JWT_SECRET:eventhub-development-secret-key-change-me-32}
