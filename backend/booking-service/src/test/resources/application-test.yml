spring:
  datasource:
    url: jdbc:h2:mem:booking_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

eventhub:
  jwt:
    secret: test-secret-key-for-jwt-signing
    expiration-ms: 3600000
  internal:
    api-key: test-internal-api-key

logging:
  level:
    com.eventhub: WARN
    org.hibernate.SQL: WARN
    org.springframework.web: WARN

# Disable external service calls by default in tests
feign:
  client:
    config:
      default:
        decode401: false
        errorDecoder: feign.codec.ErrorDecoder.Default
