server:
  port: ${PORT:8084}
spring:
  application:
    name: booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${SPRING_DATASOURCE_USERNAME:eventhub}
    password: ${SPRING_DATASOURCE_PASSWORD:eventhub}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:eventhub}
    password: ${SPRING_RABBITMQ_PASSWORD:eventhub}
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
eventhub:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
  internal-api-key: ${INTERNAL_API_KEY:eventhub-internal-secret-change-me}
  rabbitmq:
    exchange: eventhub.exchange
    queues:
      booking-created: notification.booking.created.queue
      booking-cancelled: notification.booking.cancelled.queue
    routing-keys:
      booking-created: booking.created
      booking-cancelled: booking.cancelled
